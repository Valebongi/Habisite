server {
  listen __PORT__;
  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 302 /concursos-2026;
  }

  location = /concursos-2026 {
    try_files /concursos-2026/index.html =404;
  }

  location = /concursos-2026/ {
    try_files /concursos-2026/index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
